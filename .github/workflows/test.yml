# .github/workflows/test.yml
name: Тесты LipSync модели

# Когда запускать
on:
  push:        # При каждом git push
  pull_request: # При создании pull request
  workflow_dispatch: # Можно запустить вручную

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Шаг 1: Скачать код
      - name: Скачать код
        uses: actions/checkout@v3
      
      # Шаг 2: Установить Python
      - name: Установить Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.10'
      
      # Шаг 3: Установить зависимости
      - name: Установить библиотеки
        run: |
          pip install torch numpy librosa soundfile matplotlib scikit-learn tqdm
      
      # Шаг 4: Запустить тесты
      - name: Запустить тесты
        run: python test_model.py
      
      # Шаг 5: Сохранить результат
      - name: Сохранить артефакты
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.xml